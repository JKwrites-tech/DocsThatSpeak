  <circle cx="30" cy="55" r="1.5"/><circle cx="500" cy="320" r="1.5"/>
  <circle cx="525" cy="315" r="1.5"/><circle cx="500" cy="345" r="1.5"/>
  <circle cx="475" cy="40" r="1.5"/><circle cx="505" cy="40" r="1.5"/>
</g>

