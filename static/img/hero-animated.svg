<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" role="img" aria-label="Technical writer bringing docs to life">
<defs>
  <linearGradient id="deskG" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#a16207"/>
    <stop offset="100%" stop-color="#78350f"/>
  </linearGradient>
  <linearGradient id="scrG" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0d4f4a"/>
    <stop offset="100%" stop-color="#134e4a"/>
  </linearGradient>
  <linearGradient id="blG" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#4f46e5"/>
    <stop offset="100%" stop-color="#3730a3"/>
  </linearGradient>
  <linearGradient id="chG" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#1e3a5f"/>
    <stop offset="100%" stop-color="#1e40af" stop-opacity="0.7"/>
  </linearGradient>
  <radialGradient id="scrAura" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#134e4a" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow">
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/>
  </filter>
</defs>

<style>
  @keyframes floatUp1 {
    0%   { transform:translate(0,0);    opacity:0;   }
    12%  { opacity:0.95; }
    88%  { opacity:0.6;  }
    100% { transform:translate(-6px,-80px); opacity:0; }
  }
  @keyframes floatUp2 {
    0%   { transform:translate(0,0);    opacity:0;   }
    12%  { opacity:0.9; }
    88%  { opacity:0.5; }
    100% { transform:translate(8px,-90px); opacity:0; }
  }
  @keyframes floatUp3 {
    0%   { transform:translate(0,0);    opacity:0;   }
    12%  { opacity:0.85; }
    100% { transform:translate(-4px,-75px); opacity:0; }
  }
  @keyframes floatUp4 {
    0%   { transform:translate(0,0);    opacity:0;   }
    12%  { opacity:0.8; }
    100% { transform:translate(10px,-85px); opacity:0; }
  }
  @keyframes floatUp5 {
    0%   { transform:translate(0,0);    opacity:0;   }
    12%  { opacity:0.88; }
    100% { transform:translate(-2px,-70px); opacity:0; }
  }
  @keyframes glowPulse {
    0%,100% { opacity:0.5; }
    50%     { opacity:1;   }
  }
  @keyframes bubblePop {
    0%   { transform:scale(0); opacity:0; }
    18%  { transform:scale(1.06); opacity:1; }
    28%  { transform:scale(1);    opacity:1; }
    72%  { transform:scale(1);    opacity:1; }
    100% { transform:scale(0.9);  opacity:0; }
  }
  @keyframes penBob {
    0%,100% { transform:translateY(0) rotate(0deg); }
    50%     { transform:translateY(-2px) rotate(2deg); }
  }
  @keyframes cursorBlink {
    0%,49%  { opacity:1; }
    50%,100%{ opacity:0; }
  }
  @keyframes steamUp {
    0%   { transform:translateY(0);   opacity:0.55; }
    100% { transform:translateY(-16px); opacity:0; }
  }
  @keyframes waveOut {
    0%   { stroke-dashoffset:70; opacity:0.8; }
    100% { stroke-dashoffset:0;  opacity:0;   }
  }
  @keyframes sparkle {
    0%,100%{ opacity:0; transform:scale(0); }
    50%    { opacity:1; transform:scale(1); }
  }

  .c1 { animation: floatUp1 3.4s ease-out 0s    infinite; }
  .c2 { animation: floatUp2 3.4s ease-out 0.8s  infinite; }
  .c3 { animation: floatUp3 3.4s ease-out 1.6s  infinite; }
  .c4 { animation: floatUp4 3.4s ease-out 2.4s  infinite; }
  .c5 { animation: floatUp5 3.4s ease-out 3.2s  infinite; }
  .aura { animation: glowPulse 2.8s ease-in-out infinite; }
  .bubble { animation: bubblePop 5s cubic-bezier(.34,1.56,.64,1) 1.2s infinite;
            transform-origin: 420px 130px; }
  .penArm { animation: penBob 2.2s ease-in-out infinite;
            transform-origin: 165px 270px; }
  .cur { animation: cursorBlink 1s step-end infinite; }
  .st1 { animation: steamUp 2s ease-out 0s    infinite; }
  .st2 { animation: steamUp 2s ease-out 0.65s infinite; }
  .wv1 { stroke-dasharray:70; animation: waveOut 2.6s ease-out 2.2s infinite; }
  .wv2 { stroke-dasharray:90; animation: waveOut 2.6s ease-out 2.5s infinite; }
  .sp1 { animation: sparkle 2.2s ease-in-out 0.4s  infinite; transform-origin:168px 180px; }
  .sp2 { animation: sparkle 2.2s ease-in-out 1.3s  infinite; transform-origin:232px 175px; }
  .sp3 { animation: sparkle 2.2s ease-in-out 2.1s  infinite; transform-origin:200px 168px; }
</style>

<!-- Subtle bg dots -->
<g opacity="0.07" fill="#14b8a6">
